# Local dev stack (ADR-007). Start one profile at a time on the 8 GB machine:
#   make up-stream     Kafka + Karapace (~1.3 GB)
# Images are pinned; bump deliberately, never `latest`.

name: shoppulse

services:
  kafka:
    profiles: [stream]
    image: apache/kafka:4.3.1
    hostname: kafka
    ports:
      - "9092:9092"  # for processes in WSL (replay, Spark): localhost:9092
    environment:
      CLUSTER_ID: XzyaHnstToqcbxorPE1ebw  # fixed base64 UUID so the volume formats once
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller  # single node, KRaft (no ZooKeeper)
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # One broker: internal topics cannot be replicated (ADR-001: not HA, by design).
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by kafka-init; a typo must fail, not create a topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 1g
    restart: unless-stopped  # come back after a WSL/VM restart; `make down` stops it for good
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 20s
      retries: 12
      start_period: 20s

  kafka-init:
    profiles: [stream]
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_HEAP_OPTS: -Xmx128m
    # Idempotent: create if missing, then (re)apply configs so they cannot drift.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        bin=/opt/kafka/bin; bs=kafka:19092
        # events: 6 partitions = max KEDA consumer replicas; key = store_id:user_id.
        $$bin/kafka-topics.sh --bootstrap-server $$bs --create --if-not-exists \
          --topic shoppulse.events.v1 --partitions 6 --replication-factor 1
        $$bin/kafka-configs.sh --bootstrap-server $$bs --alter --entity-type topics \
          --entity-name shoppulse.events.v1 \
          --add-config retention.ms=604800000,retention.bytes=1073741824
        # DLQ: kept longer for triage.
        $$bin/kafka-topics.sh --bootstrap-server $$bs --create --if-not-exists \
          --topic shoppulse.events.dlq.v1 --partitions 1 --replication-factor 1
        $$bin/kafka-configs.sh --bootstrap-server $$bs --alter --entity-type topics \
          --entity-name shoppulse.events.dlq.v1 \
          --add-config retention.ms=2592000000,retention.bytes=1073741824
        $$bin/kafka-topics.sh --bootstrap-server $$bs --describe --topic shoppulse.events.v1
    mem_limit: 256m
    restart: "no"

  karapace:
    profiles: [stream]
    image: ghcr.io/aiven-open/karapace:6.2.4
    hostname: karapace
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    entrypoint: ["python3", "-m", "karapace"]
    ports:
      - "8081:8081"
    environment:
      KARAPACE_KARAPACE_REGISTRY: "true"
      KARAPACE_ADVERTISED_HOSTNAME: karapace
      KARAPACE_BOOTSTRAP_URI: kafka:19092
      KARAPACE_HOST: 0.0.0.0
      KARAPACE_PORT: 8081
      KARAPACE_CLIENT_ID: karapace-registry-0
      KARAPACE_GROUP_ID: karapace-registry
      KARAPACE_MASTER_ELIGIBILITY: "true"
      KARAPACE_TOPIC_NAME: _schemas
      KARAPACE_REPLICATION_FACTOR: 1
      KARAPACE_COMPATIBILITY: BACKWARD  # ADR-003
      KARAPACE_LOG_LEVEL: WARNING
    mem_limit: 384m
    restart: unless-stopped
    healthcheck:
      # Ready only once it is the primary and has read _schemas: reads work earlier than
      # writes, and the first `make register` timed out against a reads-only "healthy".
      test: ["CMD", "python3", "-c", "import json, urllib.request; s = json.load(urllib.request.urlopen('http://localhost:8081/_health', timeout=5))['status']; assert s['schema_registry_ready'] and s['schema_registry_is_primary']"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

volumes:
  kafka-data:
