# Local hooks run the tool versions pinned in uv.lock, so pre-commit and CI
# can never disagree about which ruff/mypy version is "correct".
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false  # checks the `files` list in pyproject.toml
