name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      # TODO: pin actions to commit SHAs once the workflow is stable (supply-chain hygiene).
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4  # Spark 4 needs Java 17+
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies (fails if uv.lock is out of date)
        run: uv sync --locked --all-packages
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest
